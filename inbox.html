<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | StudentMarket</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="/index.html">StudentMarket</a><div class="nav-links"><a href="/search.html">Browse listings</a><a href="/create-listing.html">Create a listing</a><a href="/account.html">Account</a></div></nav></header>
<main><section class="panel"><p class="eyebrow">Buyer and seller conversations</p><h1>Messages</h1><p class="muted">Open a conversation to read and reply. Sellers can respond to buyers here.</p><div class="inbox-layout"><div><h2>Your conversations</h2><div id="conversationList" class="conversation-list">Loading inbox...</div></div><div><h2 id="chatTitle">Select a conversation</h2><div id="chat" class="chat">Your messages will appear here.</div><form id="sendForm" class="compose"><input id="reply" maxlength="2000" placeholder="Write a reply..." required disabled><button class="primary" id="sendButton" disabled>Send</button></form><p id="error" class="error" role="status"></p></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let currentUser=null,active=null;
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed.');return d;}
async function start(){try{const me=await api('/api/me');currentUser=me.id;await loadInbox();}catch{location.href='/login.html?next=/inbox.html';}}
async function loadInbox(){const rows=await api('/api/conversations');const host=$('conversationList');host.replaceChildren();if(!rows.length){host.textContent='No conversations yet. Message a seller from a listing to start one.';return;}for(const x of rows){const b=document.createElement('button');b.className='conversation'+(active===x.id?' active':'');b.innerHTML='';const title=document.createElement('strong');title.textContent=x.listingTitle;const meta=document.createElement('small');meta.textContent='With '+x.otherUsername+(x.unreadCount?' · '+x.unreadCount+' unread':'');const last=document.createElement('small');last.textContent=x.lastMessage||'No messages yet';b.append(title,meta,last);b.onclick=()=>openConversation(x);host.append(b);}}
async function openConversation(x){active=x.id;$('chatTitle').textContent=x.listingTitle+' · '+x.otherUsername;$('reply').disabled=false;$('sendButton').disabled=false;await refresh();await loadInbox();}
async function refresh(){const rows=await api(`/api/conversations/${active}/messages`);const host=$('chat');host.replaceChildren();if(!rows.length){host.textContent='No messages yet.';return;}for(const m of rows){const b=document.createElement('div');b.className='bubble '+(Number(m.senderId)===Number(currentUser)?'mine':'theirs');const who=document.createElement('strong');who.textContent=Number(m.senderId)===Number(currentUser)?'You':m.senderUsername;const p=document.createElement('div');p.textContent=m.body;b.append(who,p);host.append(b);}host.scrollTop=host.scrollHeight;}
$('sendForm').addEventListener('submit',async e=>{e.preventDefault();if(!active)return;const v=$('reply').value.trim();if(!v)return;try{await api(`/api/conversations/${active}/messages`,{method:'POST',body:JSON.stringify({body:v})});$('reply').value='';await refresh();await loadInbox();$('error').textContent='';}catch(err){$('error').textContent=err.message;}});
start();
</script><script src="/nav-auth.js"></script></body></html>
