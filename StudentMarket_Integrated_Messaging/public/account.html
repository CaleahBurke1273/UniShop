<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | StudentMarket</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="/index.html">StudentMarket</a><div class="nav-links"><a href="/search.html">Browse listings</a><a href="/create-listing.html">Create a listing</a><a href="/inbox.html">Messages</a></div></nav></header><main><section class="panel"><p class="eyebrow">Your account</p><h1 id="welcome">My account</h1><div id="details" class="muted">Loading account...</div><div class="row" style="margin-top:20px"><a class="btn btn-primary" href="/create-listing.html">Create a listing</a><a class="btn secondary" href="/inbox.html">Open messages</a><a class="btn secondary" href="/search.html">Browse listings</a></div></section></main><script>
(async()=>{try{const r=await fetch('/api/me');if(!r.ok){location.href='/login.html?next=/account.html';return;}const u=await r.json();document.getElementById('welcome').textContent='Welcome, '+u.fullName;document.getElementById('details').textContent='Username: '+u.username+' · School: '+u.school;}catch{location.href='/login.html?next=/account.html';}})();
</script><script src="/nav-auth.js"></script></body></html>
