<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log In | StudentMarket</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="/index.html">StudentMarket</a><div class="nav-links"><a href="/search.html">Browse listings</a><a href="/signup.html">Sign Up</a></div></nav></header>
<main><section class="panel" style="max-width:500px;margin:45px auto"><p class="eyebrow">Welcome back</p><h1>Log in</h1><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><p id="message" class="error" role="status"></p><button class="primary">Log in</button></form><p class="muted" style="margin-top:18px">New to StudentMarket? <a href="/signup.html">Create an account</a></p></section></main>
<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('message');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.username.value,password:f.password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed.');const next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/account.html';}catch(err){m.textContent=err.message;}});</script><script src="/nav-auth.js"></script></body></html>
