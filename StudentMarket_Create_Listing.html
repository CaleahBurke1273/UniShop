<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post a Listing - Student E-Commerce</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;color:#222}
  header{background:#1F3864;color:#fff;padding:14px 24px;font-size:20px}
  main{max-width:560px;margin:24px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  h1{font-size:22px;margin-top:0}
  label{display:block;margin-top:14px;font-weight:bold}
  input,select,textarea{width:100%;padding:8px;margin-top:4px;border:1px solid #999;border-radius:4px;font-size:15px;box-sizing:border-box}
  .error{color:#b00020;font-size:13px;min-height:16px}
  button{margin-top:18px;background:#1F3864;color:#fff;border:0;padding:10px 20px;border-radius:4px;font-size:16px;cursor:pointer}
  #preview img{max-width:120px;margin:6px 6px 0 0;border-radius:4px}
  #result{margin-top:20px;padding:12px;background:#e8f5e9;border-radius:4px;display:none}
</style>
</head>
<body>
<header>Student E-Commerce</header>
<main>
  <h1>Post a Listing</h1>
  <form id="listingForm" novalidate>
    <label for="title">Item name</label>
    <input id="title" type="text" maxlength="80">
    <div class="error" id="e-title"></div>

    <label for="description">Description</label>
    <textarea id="description" rows="3" maxlength="500"></textarea>
    <div class="error" id="e-description"></div>

    <label for="condition">Condition</label>
    <select id="condition">
      <option value="">Select condition</option>
      <option>New</option>
      <option>Like new</option>
      <option>Good</option>
      <option>Fair</option>
      <option>Poor</option>
    </select>
    <div class="error" id="e-condition"></div>

    <label for="price">Price ($)</label>
    <input id="price" type="number" min="0" step="0.01">
    <div class="error" id="e-price"></div>

    <label for="location">Pickup location</label>
    <input id="location" type="text" placeholder="e.g. Library entrance, Residence A">
    <div class="error" id="e-location"></div>

    <label for="pictures">Pictures (up to 4)</label>
    <input id="pictures" type="file" accept="image/*" multiple>
    <div class="error" id="e-pictures"></div>
    <div id="preview"></div>

    <button type="submit">Post listing</button>
  </form>
  <div id="result"></div>
</main>

<script>
  // Sprint 1: front-end only. Saving to the database is planned for Sprint 2.
  const form = document.getElementById('listingForm');
  const fileInput = document.getElementById('pictures');

  function setError(id, msg) { document.getElementById('e-' + id).textContent = msg; return msg === ''; }

  fileInput.addEventListener('change', () => {
    const preview = document.getElementById('preview');
    preview.innerHTML = '';
    const files = Array.from(fileInput.files);
    if (files.length > 4) { setError('pictures', 'Please choose at most 4 pictures.'); return; }
    setError('pictures', '');
    files.forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      preview.appendChild(img);
    });
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    const description = document.getElementById('description').value.trim();
    const condition = document.getElementById('condition').value;
    const price = document.getElementById('price').value;
    const location = document.getElementById('location').value.trim();
    const pics = fileInput.files.length;

    let ok = true;
    ok = setError('title', title ? '' : 'Item name is required.') && ok;
    ok = setError('description', description ? '' : 'Description is required.') && ok;
    ok = setError('condition', condition ? '' : 'Please select a condition.') && ok;
    ok = setError('price', (price !== '' && Number(price) >= 0) ? '' : 'Enter a valid price (0 or more).') && ok;
    ok = setError('location', location ? '' : 'Pickup location is required.') && ok;
    ok = setError('pictures', pics >= 1 && pics <= 4 ? '' : 'Add 1 to 4 pictures.') && ok;
    if (!ok) return;

    const r = document.getElementById('result');
    r.style.display = 'block';
    r.textContent = '';
    const strong = document.createElement('strong');
    strong.textContent = 'Listing ready: ';
    r.appendChild(strong);
    r.appendChild(document.createTextNode(
      `${title} - ${condition} - $${Number(price).toFixed(2)} - ${location} (${pics} picture${pics > 1 ? 's' : ''})`));
  });
</script>
</body>
</html>
