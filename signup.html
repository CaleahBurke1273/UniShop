<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | StudentMarket</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="/index.html">StudentMarket</a><div class="nav-links"><a href="/search.html">Browse listings</a><a href="/login.html" data-auth="guest">Log In</a></div></nav></header>
<main><section class="panel" style="max-width:560px;margin:35px auto"><p class="eyebrow">Join the community</p><h1>Create your account</h1><p class="muted">Create an account to post listings and message buyers or sellers.</p>
<form id="signupForm"><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" required maxlength="100" autocomplete="name"></div>
<div class="field"><label for="school">School</label><select id="school" name="school" required><option value="">Choose your school</option><option>Wilfrid Laurier University</option><option>University of Waterloo</option><option>University of Toronto</option><option>York University</option><option>Toronto Metropolitan University</option><option>McMaster University</option><option>Queen's University</option><option>University of Guelph</option><option>Western University</option><option>Other Ontario university</option></select></div>
<div class="field"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username"><small class="muted">3–20 letters, numbers, or underscores.</small></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="10" autocomplete="new-password"><small class="muted">At least 10 characters, including letters and numbers.</small></div>
<div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" required autocomplete="new-password"></div>
<p id="message" role="status" class="error"></p><button class="primary" type="submit">Create account</button></form><p class="muted" style="margin-top:18px">Already have an account? <a href="/login.html">Log in</a></p></section></main><script>
document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,msg=document.getElementById('message');msg.textContent='';const password=f.password.value;if(password!==document.getElementById('confirmPassword').value){msg.textContent='Passwords do not match.';return;}try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:f.fullName.value,school:f.school.value,username:f.username.value,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not create account.');location.href='/account.html';}catch(err){msg.textContent=err.message;}});
</script><script src="/nav-auth.js"></script></body></html>
