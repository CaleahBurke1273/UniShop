<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post a Listing - Student E-Commerce</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;color:#222}
  header{background:#1F3864;color:#fff;padding:14px 24px;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .nav-links{display:flex;align-items:center;gap:18px;font-size:15px}
  .nav-links a{color:#fff;text-decoration:none}
  .nav-links a:hover{text-decoration:underline}
  main{max-width:560px;margin:24px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  h1{font-size:22px;margin-top:0}
  label{display:block;margin-top:14px;font-weight:bold}
  input,select,textarea{width:100%;padding:8px;margin-top:4px;border:1px solid #999;border-radius:4px;font-size:15px;box-sizing:border-box}
  .error{color:#b00020;font-size:13px;min-height:16px}
  button{margin-top:18px;background:#1F3864;color:#fff;border:0;padding:10px 20px;border-radius:4px;font-size:16px;cursor:pointer}
  #preview img{max-width:120px;margin:6px 6px 0 0;border-radius:4px}
  #result{margin-top:20px;padding:12px;background:#e8f5e9;border-radius:4px;display:none}
</style>
</head>
<body>
<header><a href="/index.html" style="color:#fff;text-decoration:none">Student E-Commerce</a><div class="nav-links"><a href="/search.html">Browse listings</a></div></header>
<main>
  <h1>Post a Listing</h1>
  <form id="listingForm" novalidate>
    <label for="title">Item name</label>
    <input id="title" type="text" maxlength="80">
    <div class="error" id="e-title"></div>

    <label for="category">Category</label>
    <select id="category">
      <option value="">Select category</option>
      <option>Textbooks</option>
      <option>Furniture</option>
      <option>Electronics</option>
      <option>School supplies</option>
      <option>Clothing</option>
    </select>
    <div class="error" id="e-category"></div>

    <label for="description">Description</label>
    <textarea id="description" rows="3" maxlength="500"></textarea>
    <div class="error" id="e-description"></div>

    <label for="condition">Condition</label>
    <select id="condition">
      <option value="">Select condition</option>
      <option>New</option>
      <option>Like new</option>
      <option>Used - good</option>
      <option>Used - fair</option>
    </select>
    <div class="error" id="e-condition"></div>

    <label for="price">Price ($)</label>
    <input id="price" type="number" min="0" step="0.01">
    <div class="error" id="e-price"></div>

    <label for="location">Pickup location</label>
    <input id="location" type="text" placeholder="e.g. Library entrance, Residence A">
    <div class="error" id="e-location"></div>

    <label for="pictures">Pictures (up to 4)</label>
    <input id="pictures" type="file" accept="image/*" multiple>
    <div class="error" id="e-pictures"></div>
    <div id="preview"></div>

    <button type="submit">Post listing</button>
  </form>
  <div id="result"></div>
</main>

<script>
  // Sends the listing (with photos) to POST /api/listings (server.js). You must be signed in.
  const form = document.getElementById('listingForm');
  const fileInput = document.getElementById('pictures');

  function setError(id, msg) { document.getElementById('e-' + id).textContent = msg; return msg === ''; }

  fileInput.addEventListener('change', () => {
    const preview = document.getElementById('preview');
    preview.innerHTML = '';
    const files = Array.from(fileInput.files);
    if (files.length > 4) { setError('pictures', 'Please choose at most 4 pictures.'); return; }
    setError('pictures', '');
    files.forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      preview.appendChild(img);
    });
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    const description = document.getElementById('description').value.trim();
    const condition = document.getElementById('condition').value;
    const category = document.getElementById('category').value;
    const price = document.getElementById('price').value;
    const location = document.getElementById('location').value.trim();
    const pics = fileInput.files.length;

    let ok = true;
    ok = setError('title', title ? '' : 'Item name is required.') && ok;
    ok = setError('description', description ? '' : 'Description is required.') && ok;
    ok = setError('category', category ? '' : 'Please select a category.') && ok;
    ok = setError('condition', condition ? '' : 'Please select a condition.') && ok;
    ok = setError('price', (price !== '' && Number(price) >= 0) ? '' : 'Enter a valid price (0 or more).') && ok;
    ok = setError('location', location ? '' : 'Pickup location is required.') && ok;
    ok = setError('pictures', pics >= 1 && pics <= 4 ? '' : 'Add 1 to 4 pictures.') && ok;
    if (!ok) return;

    const body = new FormData();
    body.append('title', title);
    body.append('description', description);
    body.append('category', category);
    body.append('condition', condition);
    body.append('price', price);
    body.append('pickupLocation', location);
    Array.from(fileInput.files).forEach(f => body.append('pictures', f));

    const r = document.getElementById('result');
    try {
      // Don't set Content-Type: the browser sets it (with the multipart boundary) for FormData.
      const res = await fetch('/api/listings', { method: 'POST', body });
      if (res.status === 401) { window.location.href = '/login.html?next=/create-listing.html'; return; }
      const data = await res.json();
      if (!res.ok) { setError(data.field || 'title', data.error || 'Could not save the listing.'); return; }
      r.style.display = 'block';
      r.textContent = 'Listing posted. Taking you to the listings...';
      setTimeout(() => { window.location.href = '/search.html'; }, 800);
    } catch (err) {
      r.style.display = 'block';
      r.textContent = 'Could not reach the server. Is it running (node server.js)?';
    }
  });
</script>
<script src="/nav-auth.js"></script>
</body>
</html>
