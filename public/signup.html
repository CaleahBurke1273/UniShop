<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudentMarket | Create Account</title>
<style>
  :root{--navy:#182d4b;--blue:#315b88;--gold:#e4a84b;--ink:#202938;--muted:#687386;--line:#dce2e9;--paper:#f5f7fa;--white:#fff;--bad:#b00020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
  a{color:inherit}
  .site-header{background:var(--navy);color:var(--white)}
  .nav{max-width:1180px;margin:auto;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
  .brand{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;text-decoration:none}
  .nav-links{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .nav-links a{color:var(--white);text-decoration:none;font-size:.95rem}
  .nav-links a:hover,.nav-links a:focus{text-decoration:underline}
  main{max-width:520px;margin:32px auto 50px;padding:0 16px}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:28px}
  .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;font-weight:700;color:var(--blue);margin:0 0 6px}
  h1{font-size:1.8rem;line-height:1.15;margin:0 0 6px}
  .lead{color:var(--muted);margin:0 0 20px}
  label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
  input,select,button{font:inherit}
  input,select{width:100%;border:1px solid #cbd3de;border-radius:8px;padding:11px;background:#fff;color:var(--ink)}
  input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #f0bd6c;outline-offset:2px}
  .invalid{border-color:var(--bad)}
  .error{color:var(--bad);font-size:.83rem;min-height:18px;margin-top:4px}
  .hint{color:var(--muted);font-size:.83rem;margin-top:4px}
  .pw{position:relative}
  .pw input{padding-right:72px}
  .pw button{position:absolute;right:5px;top:5px;bottom:5px;border:0;border-radius:6px;background:#e9eef5;color:var(--navy);padding:0 12px;font-weight:700;font-size:.85rem;cursor:pointer}
  .primary{width:100%;margin-top:18px;border:0;border-radius:9px;padding:13px 17px;background:var(--gold);color:#17263b;font-weight:700;cursor:pointer}
  .primary:hover{background:#f0bd6c}
  #result{display:none;margin-top:18px;padding:14px;background:#e6f6ec;color:#17663a;border-radius:8px}
  @media (max-width:650px){.nav{align-items:flex-start;flex-direction:column}.panel{padding:22px 18px}main{margin-top:20px}}
</style>
</head>
<body>
<header class="site-header">
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="/index.html" aria-label="StudentMarket home">StudentMarket</a>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/search.html">Browse listings</a>
      <a href="/create-listing.html">Create a listing</a>
      <a href="/login.html">Sign in</a>
    </div>
  </nav>
</header>

<main>
  <section class="panel" aria-labelledby="page-title">
    <p class="eyebrow">Student-to-student marketplace</p>
    <h1 id="page-title">Create your account</h1>
    <p class="lead">Join students in your school community to buy and sell.</p>

    <form id="signupForm" novalidate>
      <label for="fullname">Full name</label>
      <input id="fullname" type="text" autocomplete="name">
      <div class="error" id="e-fullname"></div>

      <label for="school">School</label>
      <select id="school">
        <option value="">Select your school</option>
        <option>Algoma University</option>
        <option>Brock University</option>
        <option>Carleton University</option>
        <option>Dominican University College</option>
        <option>Huron University College</option>
        <option>King’s University College at Western</option>
        <option>Lakehead University</option>
        <option>Laurentian University</option>
        <option>McMaster University</option>
        <option>Nipissing University</option>
        <option>OCAD University</option>
        <option>Ontario Tech University</option>
        <option>Queen’s University</option>
        <option>Redeemer University</option>
        <option>Royal Military College of Canada</option>
        <option>Saint Paul University</option>
        <option>Toronto Metropolitan University</option>
        <option>Trent University</option>
        <option>Tyndale University</option>
        <option>Université de Hearst</option>
        <option>University of Guelph</option>
        <option>University of Ottawa</option>
        <option>University of Sudbury</option>
        <option>University of Toronto</option>
        <option>University of Waterloo</option>
        <option>University of Windsor</option>
        <option>Western University</option>
        <option>Wilfrid Laurier University</option>
        <option>York University</option>
      </select>
      <div class="error" id="e-school"></div>

      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
      <div class="hint">3 to 20 characters: letters, numbers, or underscores.</div>
      <div class="error" id="e-username"></div>

      <label for="password">Password</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="new-password">
        <button type="button" id="toggle" aria-label="Show password">Show</button>
      </div>
      <div class="hint">At least 10 characters, with letters and numbers.</div>
      <div class="error" id="e-password"></div>

      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password">
      <div class="error" id="e-confirm"></div>

      <button class="primary" type="submit">Create account</button>
    </form>
    <div id="result" role="status"></div>
  </section>
</main>

<script>
  // Sends the new account to POST /api/register (server.js), which saves it in the database.
  const $ = id => document.getElementById(id);
  const form = $('signupForm');

  function setError(id, msg) {
    $('e-' + id).textContent = msg;
    $(id).classList.toggle('invalid', !!msg);
    return msg === '';
  }

  $('toggle').addEventListener('click', () => {
    const show = $('password').type === 'password';
    $('password').type = show ? 'text' : 'password';
    $('toggle').textContent = show ? 'Hide' : 'Show';
    $('toggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('fullname').value.trim();
    const school = $('school').value;
    const user = $('username').value.trim();
    const pw = $('password').value;
    const pw2 = $('confirm').value;

    let ok = true;
    ok = setError('fullname', name ? '' : 'Full name is required.') && ok;
    ok = setError('school', school ? '' : 'Please select your school.') && ok;
    ok = setError('username', /^[A-Za-z0-9_]{3,20}$/.test(user) ? '' : 'Use 3 to 20 letters, numbers, or underscores.') && ok;
    ok = setError('password', (pw.length >= 10 && /[A-Za-z]/.test(pw) && /\d/.test(pw)) ? '' : 'Use at least 10 characters, with letters and numbers.') && ok;
    ok = setError('confirm', (pw2 && pw2 === pw) ? '' : 'Passwords do not match.') && ok;
    if (!ok) { const bad = document.querySelector('.invalid'); if (bad) bad.focus(); return; }

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName: name, school, username: user, password: pw })
      });
      const data = await res.json();
      if (!res.ok) { setError(data.field || 'username', data.error || 'Could not create account.'); return; }
      const r = $('result');
      r.style.display = 'block';
      r.textContent = 'Account created. Taking you to the listings...';
      setTimeout(() => { window.location.href = '/search.html'; }, 800);
    } catch (err) {
      const r = $('result');
      r.style.display = 'block';
      r.textContent = 'Could not reach the server. Is it running (node server.js)?';
    }
  });
</script>
</body>
</html>
