<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Listing | StudentMarket</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="/index.html">StudentMarket</a><div class="nav-links"><a href="/search.html">Browse listings</a><a href="/inbox.html">Messages</a><a href="/account.html">Account</a></div></nav></header><main><section class="panel" style="max-width:720px;margin:auto"><p class="eyebrow">Sell to your community</p><h1>Create a listing</h1><p class="muted">Your listing will be saved to the database and appear in search results.</p>
<form id="listingForm"><div class="field"><label for="title">Item name</label><input id="title" name="title" required maxlength="80"></div><div class="field"><label for="category">Category</label><select id="category" name="category" required><option value="">Choose category</option><option>Textbooks</option><option>Furniture</option><option>Electronics</option><option>School supplies</option><option>Clothing</option></select></div><div class="field"><label for="description">Description</label><textarea id="description" name="description" required maxlength="1500"></textarea></div><div class="row"><div class="field"><label for="condition">Condition</label><select id="condition" name="condition" required><option value="">Choose condition</option><option>New</option><option>Like new</option><option>Used - good</option><option>Used - fair</option></select></div><div class="field"><label for="price">Price (CAD)</label><input id="price" name="price" type="number" min="0" step=".01" required></div></div><div class="field"><label for="pickupLocation">Pickup location</label><input id="pickupLocation" name="pickupLocation" required maxlength="150" placeholder="e.g. Laurier campus"></div><div class="field"><label for="pictures">Photos (1–4, JPG/PNG/WebP/GIF, max 5 MB each)</label><input id="pictures" name="pictures" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required></div><p id="message" role="status" class="error"></p><button class="primary">Publish listing</button></form></section></main>
<script> (async()=>{const r=await fetch('/api/me');if(!r.ok)location.href='/login.html?next=/create-listing.html';})();document.getElementById('listingForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('message');const files=f.pictures.files;if(files.length<1||files.length>4){m.textContent='Choose between 1 and 4 photos.';return;}const fd=new FormData(f);try{const r=await fetch('/api/listings',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not publish listing.');location.href='/search.html?created=1';}catch(err){m.textContent=err.message;}});</script><script src="/nav-auth.js"></script></body></html>
